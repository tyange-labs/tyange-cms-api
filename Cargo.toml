[package]
name = "tyange-cms-api"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.13.1"
bcrypt = "0.17.0"
chrono = "0.4.40"
dotenv = "0.15.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
jsonwebtoken = "9.3.1"
poem = { version = "3.1.12", features = [
    "multipart",
    "static-files",
    "test",
] }
poem-openapi = { version = "5", features = [
    "swagger-ui",
] }
reqwest = { version = "0.12.15", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.219", features = [
    "derive",
] }
serde_json = "1.0.140"
sha2 = "0.11.1"
sqlx = { version = "0.8.3", features = [
    "sqlite",
    "runtime-tokio",
] }
tokio = { version = "1.44.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
web-push-native = "0.5.0"
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
webauthn-rs-proto = "0.5.5"
[dependencies.uuid]
version = "1.16.0"
# Lets you generate random UUIDs
features = [
    "v4",
]

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
