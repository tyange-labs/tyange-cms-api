name: workflow

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      deploy_only:
        description: "Deploy only (skip build)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    environment: deploy on tyange-home-server

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ubuntu-latest는 매 실행마다 새 VM이라 로컬 볼륨 캐시를 쓸 수 없다.
      # 대신 actions/cache로 ~/.cargo와 target/을 Cargo.lock 해시 기준으로 캐시한다.
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Create .env file
        run: |
          echo JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }} > .env
          echo TYANGE_BLOG_REDEPLOY_TOKEN=${{ secrets.TYANGE_BLOG_REDEPLOY_TOKEN }} >> .env
          echo TRUST_PROXY_FORWARDED_FOR=true >> .env
          # 패스키(WebAuthn). 비밀이 아니라 값을 그대로 둔다. RP ID가 tyange.com이면 그 아래
          # 서브도메인 어디서든 같은 패스키를 쓰고, ORIGIN은 패스키 의식을 시작하는 페이지다
          # (쉼표로 추가). 이 줄들을 빼면 패스키 엔드포인트는 503이 된다.
          echo PASSKEY_RP_ID=tyange.com >> .env
          # MCP 커넥터 승인 화면도 패스키를 쓰므로 그 주소를 origin에 덧붙인다(MCP_PUBLIC_URL이 있을 때만).
          echo "PASSKEY_RP_ORIGIN=https://gotolib.tyange.com${{ vars.MCP_PUBLIC_URL && format(',{0}', vars.MCP_PUBLIC_URL) || '' }}" >> .env
          echo UPLOAD_PATH=${{ vars.UPLOAD_PATH }} >> .env
          echo DATABASE_PATH=${{ vars.DATABASE_PATH }} >> .env
          # gotolib 책 표지 수집. 기본은 켜짐. 끄려면 repo variable COVER_FETCH_ENABLED=false.
          echo COVERS_DIR=${{ vars.COVERS_DIR }} >> .env
          echo COVER_FETCH_ENABLED=${{ vars.COVER_FETCH_ENABLED || 'true' }} >> .env
          echo COVER_CONTACT=${{ vars.COVER_CONTACT }} >> .env
          # YES24 "한국 장편소설"/"한국 단편소설" 분류 수집. 기본 켜짐. 끄려면 YES24_FETCH_ENABLED=false.
          echo YES24_FETCH_ENABLED=${{ vars.YES24_FETCH_ENABLED || 'true' }} >> .env
          echo YES24_FETCH_INTERVAL_SECS=${{ vars.YES24_FETCH_INTERVAL_SECS }} >> .env
          # gotolib 찜한 책 소장 알림(Web Push). 기본 켜짐. 끄려면 GOTOLIB_PUSH_ENABLED=false.
          echo GOTOLIB_PUSH_ENABLED=${{ vars.GOTOLIB_PUSH_ENABLED || 'true' }} >> .env
          # Claude 커넥터(원격 MCP). repo variable MCP_PUBLIC_URL(예: https://mcp.tyange.com)을 만들면 켜진다.
          # 클라이언트 id는 비밀이 아니다(PKCE 공개 클라이언트) — Claude 커넥터 설정에 같은 값을 넣는다.
          echo MCP_PUBLIC_URL=${{ vars.MCP_PUBLIC_URL }} >> .env
          echo MCP_OAUTH_CLIENT_ID=${{ vars.MCP_OAUTH_CLIENT_ID || 'tyange-claude' }} >> .env
          echo MCP_IMAGE_BASE_URL=${{ vars.MCP_IMAGE_BASE_URL }} >> .env

      - name: Build
        if: ${{ !inputs.deploy_only }}
        run: cargo build --release --verbose

      - name: Run tests
        # 수동 실행(workflow_dispatch)에서만 돌리며, skip_tests를 켜면 그때도 건너뛴다.
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_tests && !inputs.deploy_only }}
        run: cargo test --release --verbose

      # 아래 배포 4단계는 PR에서는 돌지 않는다(PR은 빌드만 확인). 예전엔 조건이 없어서 PR을 열기만 해도
      # 그 브랜치가 production에 배포됐다(2026-11, PR #1).
      - name: Stop service
        if: ${{ github.event_name != 'pull_request' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl stop tyange-cms-api.service

      - name: Prepare deployment files
        if: ${{ github.event_name != 'pull_request' && !inputs.deploy_only }}
        run: |
          mkdir -p deploy
          cp "target/release/tyange-cms-api" deploy/
          cp .env deploy/

      - name: Deploy files via SCP
        if: ${{ github.event_name != 'pull_request' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/*"
          target: ${{ vars.SERVICE_PATH }}
          strip_components: 1
          overwrite: true
          debug: true

      - name: Start service
        if: ${{ github.event_name != 'pull_request' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl start tyange-cms-api.service
