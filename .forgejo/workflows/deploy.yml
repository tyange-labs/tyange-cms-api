name: workflow

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      deploy_only:
        description: "Deploy only (skip build)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  # 러너 config.yaml의 container.options가 /ci-target 를 호스트
  # (/home/ubuntu/ci-cache/cms-api-target)로 마운트한다. 빌드 산출물이 컨테이너 밖에
  # 남아 다음 실행에서 재사용됨. ~/.cargo·~/.rustup도 같은 방식으로 영속화돼 있다.
  CARGO_TARGET_DIR: /ci-target

jobs:
  build:
    # 정정(2026-09-06): 예전엔 self-hosted가 bare host 라벨이라고 적어뒀는데,
    # 실제로 `docker ps`/`docker top`으로 확인해보니 이 라벨도 `node:lts-bookworm`
    # 컨테이너 안에서 돈다(조직 스코프 러너가 `self-hosted:docker://node:lts-bookworm`
    # 하나로만 등록돼 있고, 로그엔 콜론 뒤 이미지 지정 없이 그냥 "[self-hosted]"로만
    # 찍혀서 헷갈렸음). 즉 **매 실행마다 완전히 새 컨테이너**라 Rust도, cargo 캐시도
    # 하나도 안 남는다 — 그래서 "Ensure Rust toolchain"이 매번 실제로 rustup을
    # 새로 설치하고, 위 캐시 스텝이 없으면 의존성도 매번 처음부터 컴파일된다.
    runs-on: self-hosted
    environment: deploy on tyange-home-server

    steps:
      - uses: https://github.com/actions/checkout@v4

      # 캐시는 actions/cache가 아니라 러너 config.yaml의 container.options 볼륨
      # 마운트로 한다(actions/cache는 이 Forgejo 러너에서 ACTIONS_CACHE_URL이 안
      # 주입돼 무동작이었음 — 2026-09 확인). /root/.cargo, /root/.rustup, /ci-target
      # (CARGO_TARGET_DIR)이 호스트 /home/ubuntu/ci-cache/* 로 마운트돼 컨테이너가
      # 새로 떠도 남는다. 첫 실행만 콜드, 이후 웜(2~5분). runner.capacity=1이라
      # 잡이 직렬 실행되므로 공유 안전.

      - name: Ensure Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Create .env file
        run: |
          echo JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }} > .env
          # TYANGE_BLOG_REDEPLOY_TOKEN은 이제 Forgejo API 토큰이어야 한다(해당 저장소의
          # Actions 실행 권한 필요) — 예전 GitHub PAT는 안 통한다.
          echo TYANGE_BLOG_REDEPLOY_TOKEN=${{ secrets.TYANGE_BLOG_REDEPLOY_TOKEN }} >> .env
          echo TRUST_PROXY_FORWARDED_FOR=true >> .env
          echo UPLOAD_PATH=${{ vars.UPLOAD_PATH }} >> .env
          echo DATABASE_PATH=${{ vars.DATABASE_PATH }} >> .env

      - name: Build
        if: ${{ !inputs.deploy_only }}
        run: cargo build --release --verbose

      - name: Run tests
        if: ${{ !inputs.skip_tests && !inputs.deploy_only }}
        # --release: 바로 위 Build가 만든 target/release deps를 재사용한다. 없으면
        # 디버그 프로파일로 전체 트리를 처음부터 또 컴파일함(이 박스에서 30~40분).
        run: cargo test --release --verbose

      - name: Stop service
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo systemctl stop tyange-cms-api.service

      - name: Prepare deployment files
        if: ${{ !inputs.deploy_only }}
        run: |
          mkdir -p deploy
          cp "$CARGO_TARGET_DIR/release/tyange-cms-api" deploy/
          cp .env deploy/

      - name: Deploy files via SCP
        uses: https://github.com/appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deploy/*"
          target: ${{ vars.SERVICE_PATH }}
          strip_components: 1
          overwrite: true
          debug: true

      - name: Start service
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo systemctl start tyange-cms-api.service
