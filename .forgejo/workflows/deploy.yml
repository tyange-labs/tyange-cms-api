name: workflow

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      deploy_only:
        description: "Deploy only (skip build)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  # 러너 config.yaml의 container.options가 /ci-target 를 호스트
  # (/home/ubuntu/ci-cache/cms-api-target)로 마운트한다. 빌드 산출물이 컨테이너 밖에
  # 남아 다음 실행에서 재사용됨. ~/.cargo·~/.rustup도 같은 방식으로 영속화돼 있다.
  CARGO_TARGET_DIR: /ci-target

jobs:
  build:
    # 정정(2026-09-06): 예전엔 self-hosted가 bare host 라벨이라고 적어뒀는데,
    # 실제로 `docker ps`/`docker top`으로 확인해보니 이 라벨도 `node:lts-bookworm`
    # 컨테이너 안에서 돈다(조직 스코프 러너가 `self-hosted:docker://node:lts-bookworm`
    # 하나로만 등록돼 있고, 로그엔 콜론 뒤 이미지 지정 없이 그냥 "[self-hosted]"로만
    # 찍혀서 헷갈렸음). 즉 **매 실행마다 완전히 새 컨테이너**라 Rust도, cargo 캐시도
    # 하나도 안 남는다 — 그래서 "Ensure Rust toolchain"이 매번 실제로 rustup을
    # 새로 설치하고, 위 캐시 스텝이 없으면 의존성도 매번 처음부터 컴파일된다.
    runs-on: self-hosted
    environment: deploy on tyange-home-server

    steps:
      - uses: https://github.com/actions/checkout@v4

      # 캐시는 actions/cache가 아니라 러너 config.yaml의 container.options 볼륨
      # 마운트로 한다(actions/cache는 이 Forgejo 러너에서 ACTIONS_CACHE_URL이 안
      # 주입돼 무동작이었음 — 2026-09 확인). /root/.cargo, /root/.rustup, /ci-target
      # (CARGO_TARGET_DIR)이 호스트 /home/ubuntu/ci-cache/* 로 마운트돼 컨테이너가
      # 새로 떠도 남는다. 첫 실행만 콜드, 이후 웜(2~5분). runner.capacity=1이라
      # 잡이 직렬 실행되므로 공유 안전.

      - name: Ensure Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Create .env file
        run: |
          echo JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }} > .env
          # TYANGE_BLOG_REDEPLOY_TOKEN은 이제 Forgejo API 토큰이어야 한다(해당 저장소의
          # Actions 실행 권한 필요) — 예전 GitHub PAT는 안 통한다.
          echo TYANGE_BLOG_REDEPLOY_TOKEN=${{ secrets.TYANGE_BLOG_REDEPLOY_TOKEN }} >> .env
          echo TRUST_PROXY_FORWARDED_FOR=true >> .env
          # 패스키(WebAuthn). 비밀이 아니라 값을 그대로 둔다. RP ID가 tyange.com이면 그 아래
          # 서브도메인 어디서든 같은 패스키를 쓰고, ORIGIN은 패스키 의식을 시작하는 페이지다
          # (쉼표로 추가). 이 줄들을 빼면 패스키 엔드포인트는 503이 된다.
          echo PASSKEY_RP_ID=tyange.com >> .env
          echo PASSKEY_RP_ORIGIN=https://gotolib.tyange.com >> .env
          echo UPLOAD_PATH=${{ vars.UPLOAD_PATH }} >> .env
          echo DATABASE_PATH=${{ vars.DATABASE_PATH }} >> .env
          # gotolib 책 표지 수집. **기본은 켜짐**이다(이 줄이 배포마다 .env를 새로 만들기 때문에, 켜 두는 값이
          # push 배포에도 항상 들어가야 한다. 수동 실행의 입력값은 push 배포에는 없어서 스위치로 쓰지 않는다).
          # 끄려면 Forgejo vars에 COVER_FETCH_ENABLED=false를 만들고 다시 배포한다(코드는 정확히 "true"일 때만 돈다).
          # COVER_CONTACT는 선택(비우면 https://gotolib.tyange.com을 User-Agent에 쓴다).
          # COVERS_DIR은 비워 두면 ./data/covers(DB와 같은 영속 위치; 배포는 바이너리와 .env만 덮어쓴다).
          echo COVERS_DIR=${{ vars.COVERS_DIR }} >> .env
          echo COVER_FETCH_ENABLED=${{ vars.COVER_FETCH_ENABLED || 'true' }} >> .env
          echo COVER_CONTACT=${{ vars.COVER_CONTACT }} >> .env
          # gotolib 찜한 책 소장 알림(Web Push). 기본 켜짐이다(코드는 정확히 "true"일 때만 돈다). VAPID 키는 서버가 처음
          # 켜질 때 만들어 VAPID_KEY_PATH(비우면 ./data/vapid_private.key; 배포가 지우지 않는 곳)에 보관하므로 비밀값을 따로 두지 않는다.
          # 끄려면 Forgejo vars에 GOTOLIB_PUSH_ENABLED=false를 만들고 다시 배포한다. 선택: VAPID_SUBJECT(mailto:/https:),
          # GOTOLIB_PUSH_INTERVAL_HOURS(기본 12), GOTOLIB_PUSH_MAX_CHECKS(라운드당 도서관 API 호출 상한, 기본 300).
          echo GOTOLIB_PUSH_ENABLED=${{ vars.GOTOLIB_PUSH_ENABLED || 'true' }} >> .env
          # Craft 폴더 → 포스트 동기화(src/craft_sync.rs). CRAFT_API_URL(Craft Connect API 링크, 그 자체가 접근 권한이라
          # **secret**으로만 둔다)이 없으면 코드가 알아서 꺼진다. 기본 켜짐: 끄려면 Forgejo vars에 CRAFT_SYNC_ENABLED=false.
          # 선택 vars: CRAFT_SYNC_INTERVAL_SECS(기본 300, 최소 60), CRAFT_SYNC_STATUS(기본 published),
          # CRAFT_SYNC_IMAGE_BASE_URL(기본 https://tyange.com/api/cms), CRAFT_SYNC_WRITER_ID(기본 첫 admin 계정).
          echo CRAFT_API_URL=${{ secrets.CRAFT_API_URL }} >> .env
          echo CRAFT_SYNC_ENABLED=${{ vars.CRAFT_SYNC_ENABLED || 'true' }} >> .env
          echo CRAFT_SYNC_FOLDER_ID=${{ vars.CRAFT_SYNC_FOLDER_ID || 'C67928AC-9BC9-4343-A7A3-22115AA0DB74' }} >> .env
          echo CRAFT_SYNC_INTERVAL_SECS=${{ vars.CRAFT_SYNC_INTERVAL_SECS }} >> .env
          echo CRAFT_SYNC_STATUS=${{ vars.CRAFT_SYNC_STATUS }} >> .env
          echo CRAFT_SYNC_IMAGE_BASE_URL=${{ vars.CRAFT_SYNC_IMAGE_BASE_URL }} >> .env
          echo CRAFT_SYNC_WRITER_ID=${{ vars.CRAFT_SYNC_WRITER_ID }} >> .env

      - name: Build
        if: ${{ !inputs.deploy_only }}
        run: cargo build --release --verbose

      - name: Run tests
        # push·PR 배포에서는 테스트를 돌리지 않는다(2026-10). 이 단계가 20분 안팎으로 가장 오래 걸렸다 —
        # 같은 크레이트를 테스트 프로필로 한 번 더 컴파일하는데, 운영 서버와 같은 작은 박스(메모리 1.9GB)라
        # 스왑까지 타서 느렸다. 테스트는 push 전에 로컬에서 `cargo test`로 돌린다.
        # 수동 실행(workflow_dispatch)에서만 돌리며, skip_tests를 켜면 그때도 건너뛴다.
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_tests && !inputs.deploy_only }}
        # --release: 바로 위 Build가 만든 target/release deps를 재사용한다. 없으면
        # 디버그 프로파일로 전체 트리를 처음부터 또 컴파일함(이 박스에서 30~40분).
        run: cargo test --release --verbose

      - name: Stop service
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo systemctl stop tyange-cms-api.service

      - name: Prepare deployment files
        if: ${{ !inputs.deploy_only }}
        run: |
          mkdir -p deploy
          cp "$CARGO_TARGET_DIR/release/tyange-cms-api" deploy/
          cp .env deploy/

      - name: Deploy files via SCP
        uses: https://github.com/appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deploy/*"
          target: ${{ vars.SERVICE_PATH }}
          strip_components: 1
          overwrite: true
          debug: true

      - name: Start service
        uses: https://github.com/appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo systemctl start tyange-cms-api.service
